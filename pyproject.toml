[build-system]
requires = ["setuptools>=40.8.0", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint.isort]
lines-between-types = 1
lines-after-imports = 2

[project]
name = "vipe"
description = "NVIDIA Video Pose Engine"
authors = [
    {name = "The ViPE Authors", email = "jiahuih@nvidia.com"},
]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "numpy",
    "einops",
    "omegaconf",
    "tqdm",
    "rerun-sdk",
    "imageio[ffmpeg]",
    "opencv-python",
    "python-pycg",
    "timm",
    "transformers",
    # Capped below 6: gdown 6 dropped the `fuzzy` parameter (fuzzy URL parsing
    # became the default), but priors/track_anything/__init__.py still passes
    # fuzzy=True when fetching the AOT checkpoint. With gdown 6 installed that
    # raises TypeError at pipeline construction, which the MIND scoring path
    # swallows per-sample as "[skip action] ViPE extract_traj crashed" -- so the
    # run completes and silently produces no action metric at all.
    "gdown<6",
    "OpenEXR",
    "kornia",
    "viser",
    "click",
    # cli/main.py imports hydra, but it was never declared. The package installs
    # fine and `import vipe` works; only the `vipe` console script fails, and
    # only when first executed -- which for MIND is inside the scoring pool.
    "hydra-core",
]

[project.optional-dependencies]
dav3 = [
    "depth-anything-3 @ git+https://github.com/heiwang1997/Depth-Anything-3.git@main"
]

[project.scripts]
vipe = "vipe.cli.main:main"
